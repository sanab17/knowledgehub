<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowledgeHub - Enterprise Document Portal</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <!-- Header / Topbar -->
    <header class="app-header navbar navbar-expand-lg navbar-dark sticky-top px-4 py-3">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <i class="fa-solid fa-cubes-stacked me-2 text-gradient fs-4"></i>
            <span class="fw-bold tracking-tight text-white fs-4">Knowledge<span class="text-gradient">Hub</span></span>
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNavbar" aria-controls="topNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="topNavbar">
            <ul class="navbar-nav align-items-center gap-3">
                <li class="nav-item d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
                    <span class="text-secondary small">Logged in as:</span>
                    <span class="text-white fw-semibold" sec:authentication="name">Username</span>
                    
                    <!-- Admin Badge -->
                    <span sec:authorize="hasRole('ADMIN')" class="badge-admin">
                        <i class="fa-solid fa-shield-halved me-1"></i>ADMIN
                    </span>
                    
                    <!-- Employee Badge -->
                    <span sec:authorize="hasRole('EMPLOYEE')" class="badge-employee">
                        <i class="fa-solid fa-user me-1"></i>EMPLOYEE
                    </span>
                </li>
                
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <!-- Spring Security 6 expects POST logout, let's make a form to trigger it -->
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-custom">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Navigation -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse px-0 py-3">
                <div class="position-sticky">
                    <ul class="nav flex-column gap-1">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}" th:classappend="${currentUri == '/' or currentUri == '/dashboard' ? 'active' : ''}">
                                <i class="fa-solid fa-chart-pie me-2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/documents}" th:classappend="${currentUri != null and currentUri.startsWith('/documents') and !currentUri.contains('/upload') ? 'active' : ''}">
                                <i class="fa-solid fa-folder-open me-2"></i> Documents
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/documents/upload}" th:classappend="${currentUri != null and currentUri.contains('/upload') ? 'active' : ''}">
                                <i class="fa-solid fa-cloud-arrow-up me-2"></i> Upload File
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link" th:href="@{/admin/audit-logs}" th:classappend="${currentUri != null and currentUri.startsWith('/admin/audit-logs') ? 'active' : ''}">
                                <i class="fa-solid fa-list-check me-2"></i> Audit Logs
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content Area -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                
                <!-- Toast alert for dynamic messages -->
                <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show glass-card border-success text-success p-3 mb-4 animate-fade-in-up" role="alert">
                    <i class="fa-solid fa-circle-check me-2"></i>
                    <strong th:text="${successMsg}">Success Message</strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show glass-card border-danger text-danger p-3 mb-4 animate-fade-in-up" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-2"></i>
                    <strong th:text="${errorMsg}">Error Message</strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Insert individual page content -->
                <div th:replace="${content}"></div>
                
            </main>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
