<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | KnowledgeHub</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="min-height: 100vh; background-color: var(--bg-primary);">

    <div class="container animate-fade-in-up">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5 text-center">
                
                <!-- Icon -->
                <div class="mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle p-4 mb-3" 
                         th:style="${status == 404 ? 'background-color: rgba(245, 158, 11, 0.15);' : 
                                   (status == 403 ? 'background-color: rgba(244, 63, 94, 0.15);' : 'background-color: rgba(244, 63, 94, 0.15);')}">
                        
                        <i th:class="${status == 404 ? 'fa-solid fa-map-location-dot text-amber fs-1' : 
                                     (status == 403 ? 'fa-solid fa-user-lock text-danger fs-1' : 'fa-solid fa-triangle-exclamation text-danger fs-1')}"
                           th:style="${status == 404 ? 'color: var(--accent-amber);' : 'color: var(--accent-rose);'}"></i>
                    </div>
                    
                    <h1 class="display-3 fw-bold text-white mb-2" th:text="${status != null ? status : '500'}">500</h1>
                    <h3 class="fw-bold text-white mb-3" th:text="${errorTitle != null ? errorTitle : 'Unexpected Error'}">Unexpected Error</h3>
                    
                    <p class="text-secondary mb-4 px-3" style="line-height: 1.6;" 
                       th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred on our servers. Please try again later or contact your system administrator.'}">
                        An error occurred.
                    </p>
                </div>

                <!-- Back to safety button -->
                <a th:href="@{/}" class="btn btn-primary-gradient px-4 py-2">
                    <i class="fa-solid fa-house me-2"></i> Return to Dashboard
                </a>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
