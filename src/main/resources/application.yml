spring:
  application:
    name: knowledgehub

  # Database settings
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:knowledgehub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate (flyway creates schema, so hibernate shouldn't)
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  # Servlet & File Upload Configs
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false # We will use custom error pages

# Spring Boot Actuator settings
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

# Custom application properties
app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
    allowed-types: "application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    max-size-bytes: 10485760 # 10MB in bytes
