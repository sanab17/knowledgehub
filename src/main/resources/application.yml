spring:
  application:
    name: knowledgehub

  # Database settings
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:knowledgehub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate (flyway creates schema, so hibernate shouldn't)
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  # Servlet & File Upload Configs
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  session:
    store-type: ${SPRING_SESSION_STORE_TYPE:jdbc}
    jdbc:
      initialize-schema: never

  cloud:
    aws:
      s3:
        endpoint: ${AWS_S3_ENDPOINT:}
        path-style-access-enabled: true
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false # We will use custom error pages

# Spring Boot Actuator settings
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

# Custom application properties
app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
    allowed-types: "application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    max-size-bytes: 10485760 # 10MB in bytes
  storage:
    provider: ${STORAGE_PROVIDER:local}
    s3:
      bucket: ${AWS_S3_BUCKET:knowledgehub-uploads}
